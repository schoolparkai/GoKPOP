name: GOKPOP Streamlit watchdog

on:
  workflow_dispatch:
  schedule:
    # UTC 00:17, 06:17, 12:17, 18:17 (KST 09:17, 15:17, 21:17, 03:17).
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: gokpop-streamlit-watchdog
  cancel-in-progress: false

jobs:
  check-site:
    # Publish only after approval. Run manually first; then set repository
    # variable GOKPOP_WATCHDOG_ENABLED=true to enable scheduled browser checks.
    if: >-
      github.repository == 'schoolparkai/GoKPOP' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.GOKPOP_WATCHDOG_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out monitor only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: ops/streamlit_watchdog

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install browser checker (separate from app requirements)
        run: |
          python -m pip install --disable-pip-version-check -r ops/streamlit_watchdog/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test normal, sleep, error and timeout handling locally
        run: python -m unittest discover -s ops/streamlit_watchdog -p 'test_*.py' -v

      - name: Check public site and wake only if sleeping
        run: python ops/streamlit_watchdog/check_site.py --output-dir "$RUNNER_TEMP/gokpop-watchdog"

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gokpop-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gokpop-watchdog/
          if-no-files-found: warn
          retention-days: 7
